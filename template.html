<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tau Paper Taxonomy</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e3e3df;
  --accent: #2f5bd3; --accent-soft: #e8eefc; --hover: #f1f1ee;
  --c-exp: #e9f0ff; --c-exp-ink: #2a4a9a;
  --c-coll: #e8f6ee; --c-coll-ink: #23704a;
  --c-topic: #fbf0e3; --c-topic-ink: #8a4b12;
  --c-type: #efeff1; --c-type-ink: #50535a;
  --c-bin: #f1e9fb; --c-bin-ink: #6a3aa8;
  --c-read: #e3f4e8; --c-read-ink: #1f7a3e;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --edge: #aeb3ba; --cites: #1d1f23; --citedby: #b5481e; --lane: #f1f1ee;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2e3238;
    --accent: #7d9df0; --accent-soft: #24304d; --hover: #252930;
    --c-exp: #22304d; --c-exp-ink: #a9c0f5;
    --c-coll: #1d3529; --c-coll-ink: #8fd4ae;
    --c-topic: #3a2c1c; --c-topic-ink: #f0c18e;
    --c-type: #2a2d33; --c-type-ink: #b6b9c0;
    --c-bin: #33264a; --c-bin-ink: #cdb2f2;
    --c-read: #1d3a27; --c-read-ink: #86d9a0;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --edge: #4d535b; --cites: #e6e6e3; --citedby: #f08a5d; --lane: #191b1f;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --panel: #1d2024; --ink: #e6e6e3; --muted: #9a9ea6; --line: #2e3238;
  --accent: #7d9df0; --accent-soft: #24304d; --hover: #252930;
  --c-exp: #22304d; --c-exp-ink: #a9c0f5;
  --c-coll: #1d3529; --c-coll-ink: #8fd4ae;
  --c-topic: #3a2c1c; --c-topic-ink: #f0c18e;
  --c-type: #2a2d33; --c-type-ink: #b6b9c0;
  --c-bin: #33264a; --c-bin-ink: #cdb2f2;
  --c-read: #1d3a27; --c-read-ink: #86d9a0;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --edge: #4d535b; --cites: #e6e6e3; --citedby: #f08a5d; --lane: #191b1f;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }

.layout { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
aside { background: var(--panel); border-right: 1px solid var(--line); padding: 16px; overflow-y: auto; max-height: 100vh; position: sticky; top: 0; }
main { padding: 20px 28px 60px; min-width: 0; }
h1 { font-size: 18px; margin: 0 0 2px; }
.sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }

input[type=search] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
.facet { margin-top: 16px; }
.facet-head { display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
.facet-head button { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 11px; text-transform: none; letter-spacing: 0; padding: 0; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-left: 6px; }
.mode button { color: var(--muted); padding: 0 6px; font-size: 11px; }
.mode button.on { background: var(--accent-soft); color: var(--accent); }
.tree-group > .row { font-weight: 600; }
.tree-group > .kids { padding-left: 18px; }
.row { display: flex; align-items: center; gap: 6px; padding: 2px 4px; border-radius: 4px; cursor: pointer; user-select: none; }
.row:hover { background: var(--hover); }
.row input { margin: 0; accent-color: var(--accent); }
.row .lbl { flex: 1; }
.row .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.row.zero { opacity: .45; }
.twisty { width: 12px; color: var(--muted); font-size: 10px; text-align: center; }
.years { display: flex; gap: 6px; align-items: center; }
.years input { width: 72px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--bg); }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 14px; }
.toolbar label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.toolbar select { padding: 4px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); }
.count { font-weight: 600; font-size: 15px; margin-right: auto; }
.btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; font-size: 12px; }
.btn:hover { background: var(--hover); }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.active-filters .chip { cursor: pointer; }
.active-filters .chip::after { content: " ×"; }

details.group { margin: 6px 0; }
details.group > summary { cursor: pointer; list-style: none; padding: 6px 4px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 8px; }
details.group > summary::-webkit-details-marker { display: none; }
details.group > summary::before { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; }
details.group[open] > summary::before { content: "▾"; }
details.group.l1 > summary { font-size: 16px; font-weight: 650; }
details.group.l2 > summary { font-size: 14px; font-weight: 600; }
details.group.l3 > summary { font-size: 13px; font-weight: 600; color: var(--muted); }
details.group > .body { padding-left: 14px; }
summary .gn { color: var(--muted); font-weight: 400; font-size: 12px; }

.paper { padding: 9px 10px; border-radius: 6px; margin: 2px 0; }
.paper:hover { background: var(--panel); }
.paper .t { font-weight: 550; }
.paper .m { color: var(--muted); font-size: 12.5px; margin-top: 1px; }
.paper .m .yr { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; align-items: center; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 10px; white-space: nowrap; }
.chip.exp { background: var(--c-exp); color: var(--c-exp-ink); }
.chip.coll { background: var(--c-coll); color: var(--c-coll-ink); }
.chip.topic { background: var(--c-topic); color: var(--c-topic-ink); }
.chip.type { background: var(--c-type); color: var(--c-type-ink); }
.key { font-family: var(--mono); font-size: 11px; color: var(--muted); cursor: pointer; border: 0; background: none; padding: 0 0 0 4px; }
.key:hover { color: var(--accent); }
pre.raw { font-family: var(--mono); font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; overflow-x: auto; margin: 6px 0 0; }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }
.chip.bin { background: var(--c-bin); color: var(--c-bin-ink); cursor: pointer; }
.chip.bin .x { margin-left: 4px; opacity: .6; }
.chip.bin .x:hover { opacity: 1; }
.paper { display: grid; grid-template-columns: 22px 1fr; column-gap: 6px; }
.paper > .pick { padding-top: 2px; }
.paper > .pick input { accent-color: var(--accent); margin: 0; }
.paper.picked { background: var(--accent-soft); }
.paper.isread .t a, .paper.isread .t > span.tt { color: var(--muted); }
.readtoggle { font-size: 11px; padding: 1px 7px; border-radius: 10px; border: 1px dashed var(--line); background: none; cursor: pointer; color: var(--muted); }
.readtoggle.on { border: 1px solid transparent; background: var(--c-read); color: var(--c-read-ink); }
.readmark { color: var(--c-read-ink); font-weight: 700; margin-right: 4px; }
.others { margin-top: 6px; border-left: 2px solid var(--c-bin); padding-left: 10px; }
.others .oh { font-size: 11px; color: var(--c-bin-ink); font-weight: 600; margin-bottom: 2px; }
.others .o { font-size: 12.5px; padding: 2px 0; display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.others .o .yr { font-weight: 600; font-variant-numeric: tabular-nums; }
.others .o.isread a { color: var(--muted); }
.others .o.out { opacity: .55; }
.selbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); box-shadow: 0 4px 18px rgba(0,0,0,.15); border-radius: 8px; padding: 8px 12px; display: none; gap: 8px; align-items: center; z-index: 5; max-width: calc(100vw - 32px); flex-wrap: wrap; }
.selbar.show { display: flex; }
.selbar .sn { font-weight: 600; margin-right: 4px; }
.banner { background: var(--c-topic); color: var(--c-topic-ink); padding: 8px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; display: none; }
.banner.show { display: block; }
.toolbar label.check { color: var(--ink); }
.toast { z-index: 6; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 7px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.menu-btn { display: none; }

/* ---- tabs + citation graph ---- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 7px 14px; cursor: pointer; color: var(--muted); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.tabs button:focus-visible, .gnode:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gview[hidden], .lview[hidden] { display: none !important; }
.glegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin-bottom: 10px; align-items: center; }
.glegend span { display: inline-flex; gap: 5px; align-items: center; }
.glegend b { color: var(--ink); font-weight: 600; margin-right: 2px; }
.gstage { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }
.gstage svg { display: block; max-width: none; }
.glane { fill: var(--lane); }
.glane-l { font-size: 12px; font-weight: 600; fill: var(--ink); }
.glane-n { font-size: 11px; fill: var(--muted); }
.gaxis { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
.ggrid { stroke: var(--line); stroke-dasharray: 2 3; }
.gedge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .32; }
.gedge.out { stroke: var(--cites); stroke-width: 1.8; opacity: 1; }
.gedge.in { stroke: var(--citedby); stroke-width: 1.8; opacity: 1; stroke-dasharray: 5 3; }
.gedge.dim { opacity: .04; }
.gnode { cursor: pointer; }
.gnode path { stroke: var(--panel); stroke-width: 1.5; }
.gnode.noref path { stroke: var(--ink); stroke-width: 1; stroke-dasharray: 2 1.5; }
.gnode text { font-size: 10.5px; fill: var(--muted); pointer-events: none; paint-order: stroke; stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; }
.gnode.dim { opacity: .13; }
.gnode.sel text { fill: var(--ink); font-weight: 650; }
.gnode.isread text { font-style: italic; }
.gtip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 22px rgba(0,0,0,.15); border-radius: 6px; padding: 9px 11px; max-width: 360px; font-size: 12.5px; line-height: 1.4; z-index: 4; }
.gtip .tt { font-weight: 600; }
.gtip .mm { color: var(--muted); margin-top: 3px; }
.gdetail { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-top: 14px; }
.gdetail > div { min-width: 0; }
.gdetail h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
.gdetail h2 { font-size: 15px; margin: 0 0 4px; }
.gdetail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.gdetail li { display: flex; gap: 6px; align-items: baseline; font-size: 12.5px; }
.gdetail li button { all: unset; cursor: pointer; }
.gdetail li button:hover { text-decoration: underline; }
.gdetail .yr { font-weight: 600; font-variant-numeric: tabular-nums; flex: none; }
.src { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--c-type); color: var(--c-type-ink); white-space: nowrap; flex: none; }
.gmissing { margin-top: 14px; }
.gmissing summary { cursor: pointer; font-weight: 600; }
.gmissing table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin-top: 8px; }
.gmissing th, .gmissing td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.gmissing th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.gmissing td.n { text-align: right; font-variant-numeric: tabular-nums; }
.gnote { font-size: 12px; color: var(--muted); margin-top: 10px; max-width: 100ch; }

@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  aside { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); display: none; }
  aside.open { display: block; }
  main { padding: 16px; }
  .menu-btn { display: inline-block; }
}
</style>
</head>
<body>
<div class="layout">
  <aside id="side">
    <h1>Tau paper taxonomy</h1>
    <div class="sub" id="src"></div>
    <input type="search" id="q" placeholder="Search title, authors, key, report no…">
    <div id="facets"></div>
  </aside>
  <main>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-list" data-view="list">Papers</button>
      <button role="tab" id="tab-graph" data-view="graph">Citation graph</button>
    </div>
    <div class="lview" id="lview">
    <div class="toolbar">
      <button class="btn menu-btn" id="menu">Filters</button>
      <span class="count" id="count"></span>
      <label>Group by <select id="g1"></select></label>
      <label>then <select id="g2"></select></label>
      <label>then <select id="g3"></select></label>
      <label>Sort <select id="sort">
        <option value="year-desc">Newest first</option>
        <option value="year-asc">Oldest first</option>
        <option value="title">Title</option>
        <option value="author">Author</option>
      </select></label>
    </div>
    <div class="toolbar">
      <button class="btn" id="expand">Expand all</button>
      <button class="btn" id="collapse">Collapse all</button>
      <button class="btn" id="cite">Copy \cite{…}</button>
      <button class="btn" id="dlbib">Download .bib</button>
      <button class="btn" id="dlcsv">Download .csv</button>
      <button class="btn" id="reset">Reset filters</button>
      <label class="check"><input type="checkbox" id="merge"> Merge bins</label>
    </div>
    <div class="banner" id="banner">Read-only copy: start the viewer with <code>./tau_taxonomy</code> to tick papers as read and edit bins.</div>
    <div class="active-filters" id="active"></div>
    <div id="list"></div>
    </div>
    <div class="gview" id="gview" hidden>
      <div class="toolbar">
        <button class="btn menu-btn" id="menu2">Filters</button>
        <span class="count" id="gcount"></span>
        <label>Lanes <select id="glane">
          <option value="facility">Facility</option><option value="area">Topic area</option>
          <option value="coll">Collision type</option><option value="doctype">Document type</option>
        </select></label>
        <label>Colour <select id="gcolor">
          <option value="area">Topic area</option><option value="facility">Facility</option>
          <option value="coll">Collision type</option>
        </select></label>
        <label class="check"><input type="checkbox" id="glabels"> Labels</label>
      </div>
      <div class="glegend" id="glegend"></div>
      <div class="gstage" id="gstage"><svg id="gsvg" role="img" aria-label="Citation timeline"></svg><div class="gtip" id="gtip" hidden></div></div>
      <div class="gdetail" id="gdetail"></div>
      <details class="gmissing" id="gmissing"></details>
      <p class="gnote" id="gnote"></p>
    </div>
  </main>
</div>
<div class="selbar" id="selbar">
  <span class="sn" id="selcount"></span>
  <button class="btn" id="selbin">Put in bin…</button>
  <button class="btn" id="selunbin">Remove from bins</button>
  <button class="btn" id="selread">Mark read</button>
  <button class="btn" id="selunread">Mark unread</button>
  <button class="btn" id="selclear">Clear selection</button>
</div>
<div class="toast" id="toast"></div>

<script>
const DATA = /*__DATA__*/null;
const M = DATA.meta, P = DATA.papers;
const BYKEY = Object.fromEntries(P.map(p => [p.key, p]));
const EDITABLE = location.protocol.startsWith("http");

// ---- read marks & bins (persisted to read.txt / bins.txt via serve.py) ----
let READ = new Set(DATA.read);
let BINS = DATA.bins.map(b => ({ ...b, keys: b.keys.filter(k => BYKEY[k]) })).filter(b => b.keys.length > 1);
let binOf = {};
function indexBins() {
  BINS = BINS.filter(b => b.keys.length > 1);
  binOf = {};
  for (const b of BINS) for (const k of b.keys) binOf[k] = b;
}
indexBins();
const NOBIN = "__nobin";

async function persist(what) {
  if (!EDITABLE) { toast("Read-only: start with ./tau_taxonomy to save"); return; }
  const body = what === "read" ? [...READ] : BINS.map(b => ({ name: b.name, keys: b.keys, note: b.note || "" }));
  try {
    const r = await fetch("/api/" + what, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error(await r.text());
  } catch (e) { toast("Could not save " + what + ": " + e.message); }
}
function setRead(keys, on) {
  keys.forEach(k => on ? READ.add(k) : READ.delete(k));
  persist("read"); update();
}
function removeFromBins(keys) {
  for (const b of BINS) b.keys = b.keys.filter(k => !keys.includes(k));
  indexBins(); persist("bins"); update();
}
function putInBin(keys) {
  const existing = [...new Set(keys.map(k => binOf[k]).filter(Boolean))];
  const suggestion = existing.length ? existing[0].name : (BYKEY[keys[0]] ? BYKEY[keys[0]].title.slice(0, 60) : "");
  const hint = BINS.length ? "\n\nExisting bins: " + BINS.map(b => b.name).join(" · ") : "";
  let name = prompt("Bin name (an existing name adds to that bin; bins of the selected papers are merged into it):" + hint, suggestion);
  if (name === null) return;
  name = name.replace(/\|/g, "/").trim();
  if (!name) return;
  let target = BINS.find(b => b.name === name);
  if (!target) { target = { name, keys: [], note: "" }; BINS.push(target); }
  // merge whole bins the selected papers were already in
  const moving = new Set(keys);
  for (const b of existing) if (b !== target) b.keys.forEach(k => moving.add(k));
  for (const b of BINS) if (b !== target) b.keys = b.keys.filter(k => !moving.has(k));
  for (const k of moving) if (!target.keys.includes(k)) target.keys.push(k);
  if (target.keys.length < 2) toast("A bin needs at least two papers");
  indexBins(); persist("bins"); SEL.clear(); update();
}
function editBinNote(b) {
  const note = prompt(`Note for bin "${b.name}":`, b.note || "");
  if (note === null) return;
  b.note = note.replace(/\|/g, "/").trim(); persist("bins"); update();
}

// ---- selection ----
const SEL = new Set();
function renderSelbar() {
  const bar = document.getElementById("selbar");
  bar.classList.toggle("show", SEL.size > 0);
  document.getElementById("selcount").textContent = SEL.size + " selected";
}

const UNCL = "__none";
const expLabel = c => c === UNCL ? "Unclassified" : M.experiments[c].label;
const facOf = c => c === UNCL ? "Unclassified" : M.experiments[c].facility;
const topicLabel = c => c === UNCL ? "Unclassified" : M.topics[c].label;
const topicGroup = c => c === UNCL ? "Unclassified" : M.topics[c].group;
const collLabel = c => M.collisions[c] || "Unclassified";
const exps = p => p.exp.length ? p.exp : [UNCL];
const tops = p => p.topics.length ? p.topics : [UNCL];

const DOCTYPES = ["Journal article", "Journal (review)", "Preprint", "Public note (CONF / PUB / PAS / DP)",
                  "Proceedings / talk", "Technical design report"];
const decade = y => Math.floor(y / 10) * 10 + "s";

// ---- facets: each has value-extractor (array) and tree structure ----
const FACETS = [
  { id: "exp", title: "Experiment", values: exps, mode: "any",
    tree: () => {
      const facs = [...M.facilityOrder];
      if (P.some(p => !p.exp.length)) facs.push("Unclassified");
      return facs.map(f => ({ label: f, kids: [...Object.keys(M.experiments).filter(c => M.experiments[c].facility === f),
                                                ...(f === "Unclassified" ? [UNCL] : [])].map(c => ({ code: c, label: expLabel(c) })) }));
    } },
  { id: "coll", title: "Collision type", values: p => [p.coll || UNCL], mode: "any",
    tree: () => Object.keys(M.collisions).map(c => ({ code: c, label: M.collisions[c] })) },
  { id: "topic", title: "Topic", values: tops, mode: "any", modeToggle: true,
    tree: () => M.topicGroupOrder.map(g => ({ label: g, kids: Object.keys(M.topics).filter(c => M.topics[c].group === g).map(c => ({ code: c, label: topicLabel(c) })) })) },
  { id: "doctype", title: "Document type", values: p => [p.doctype], mode: "any",
    tree: () => DOCTYPES.map(d => ({ code: d, label: d })) },
  { id: "status", title: "Reading status", values: p => [READ.has(p.key) ? "read" : "unread"], dynamic: true,
    tree: () => [{ code: "read", label: "Read" }, { code: "unread", label: "Unread" }] },
  { id: "bin", title: "Bins", values: p => [binOf[p.key] ? binOf[p.key].name : NOBIN], dynamic: true,
    tree: () => [{ code: NOBIN, label: "Not in a bin" },
                 { label: `Bins (${BINS.length})`, kids: [...BINS].sort((a, b) => a.name.localeCompare(b.name)).map(b => ({ code: b.name, label: b.name })) }] },
];

// ---- grouping dimensions ----
const GROUPS = {
  none: { label: "—" },
  facility: { label: "Facility", keys: p => [...new Set(exps(p).map(facOf))], order: [...M.facilityOrder, "Unclassified"] },
  exp: { label: "Experiment", keys: p => exps(p).map(expLabel), order: [...Object.keys(M.experiments).map(expLabel), "Unclassified"] },
  coll: { label: "Collision type", keys: p => [collLabel(p.coll)], order: [...Object.values(M.collisions), "Unclassified"] },
  topicgroup: { label: "Topic area", keys: p => [...new Set(tops(p).map(topicGroup))], order: [...M.topicGroupOrder, "Unclassified"] },
  topic: { label: "Topic", keys: p => tops(p).map(topicLabel), order: [...Object.keys(M.topics).map(topicLabel), "Unclassified"] },
  doctype: { label: "Document type", keys: p => [p.doctype], order: DOCTYPES },
  decade: { label: "Decade", keys: p => [decade(p.year)], order: null },

// ---- state ----
const yrs = P.map(p => p.year).filter(Boolean);
const YMIN = Math.min(...yrs), YMAX = Math.max(...yrs);
const DEFAULT = { q: "", sel: { exp: [], coll: [], topic: [], doctype: [], status: [], bin: [] }, topicMode: "any",
                  y0: YMIN, y1: YMAX, g1: "facility", g2: "topic", g3: "none", sort: "year-desc", open: [], merge: true,
                  view: "list", glane: "facility", gcolor: "area", glabels: true };
let S = loadState();

function loadState() {
  try {
    const h = decodeURIComponent(location.hash.slice(1));
    if (h) {
      const st = Object.assign(structuredClone(DEFAULT), JSON.parse(h));
      st.sel = Object.assign(structuredClone(DEFAULT.sel), st.sel);
      return st;
    }
  } catch (e) {}
  return structuredClone(DEFAULT);
}
function saveState() {
  try { history.replaceState(null, "", "#" + encodeURIComponent(JSON.stringify(S))); } catch (e) {}
}

// ---- filtering ----
function textMatch(p, q) {
  if (!q) return true;
  const hay = (p.title + " " + p.allAuthors + " " + p.key + " " + p.report + " " + p.venue + " " + p.year).toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function facetMatch(p, f, sel) {
  if (!sel.length) return true;
  const v = f.values(p);
  if (f.id === "topic" && S.topicMode === "all") return sel.every(s => v.includes(s));
  return sel.some(s => v.includes(s));
}
function passes(p, except) {
  if (!textMatch(p, S.q)) return false;
  if (p.year < S.y0 || p.year > S.y1) return false;
  return FACETS.every(f => f.id === except || facetMatch(p, f, S.sel[f.id]));
}

// ---- sidebar ----
function renderFacets() {
  const root = document.getElementById("facets");
  root.innerHTML = "";
  for (const f of FACETS) {
    const pool = P.filter(p => passes(p, f.id));
    const cnt = {};
    for (const p of pool) for (const v of f.values(p)) cnt[v] = (cnt[v] || 0) + 1;
    const total = {};
    for (const p of P) for (const v of f.values(p)) total[v] = (total[v] || 0) + 1;

    const box = el("div", "facet");
    const head = el("div", "facet-head");
    const ttl = el("span"); ttl.textContent = f.title;
    if (f.modeToggle) {
      const mode = el("span", "mode");
      for (const m of ["any", "all"]) {
        const b = el("button", S.topicMode === m ? "on" : "");
        b.textContent = m; b.title = m === "any" ? "Paper has at least one selected topic" : "Paper has all selected topics";
        b.onclick = () => { S.topicMode = m; update(); };
        mode.append(b);
      }
      ttl.append(mode);
    }
    head.append(ttl);
    if (S.sel[f.id].length) {
      const clr = el("button"); clr.textContent = "clear";
      clr.onclick = () => { S.sel[f.id] = []; update(); };
      head.append(clr);
    }
    box.append(head);

    const leaf = n => {
      if (!total[n.code]) return null;
      const r = el("label", "row" + (cnt[n.code] ? "" : " zero"));
      const cb = document.createElement("input"); cb.type = "checkbox";
      cb.checked = S.sel[f.id].includes(n.code);
      cb.onchange = () => toggle(f.id, [n.code], cb.checked);
      const l = el("span", "lbl"); l.textContent = n.label;
      const c = el("span", "n"); c.textContent = cnt[n.code] || 0;
      r.append(el("span", "twisty"), cb, l, c);
      return r;
    };
    for (const n of f.tree()) {
      if (!n.kids) { const r = leaf(n); if (r) box.append(r); continue; }
      const kids = n.kids.filter(k => total[k.code]);
      if (!kids.length) continue;
      const codes = kids.map(k => k.code);
      const g = el("div", "tree-group");
      const r = el("div", "row");
      const tw = el("span", "twisty");
      const openKey = f.id + ":" + n.label;
      const isOpen = S.open.includes(openKey) || codes.some(c => S.sel[f.id].includes(c));
      tw.textContent = isOpen ? "▾" : "▸";
      const cb = document.createElement("input"); cb.type = "checkbox";
      const nsel = codes.filter(c => S.sel[f.id].includes(c)).length;
      cb.checked = nsel === codes.length; cb.indeterminate = nsel > 0 && nsel < codes.length;
      cb.onclick = e => e.stopPropagation();
      cb.onchange = () => toggle(f.id, codes, cb.checked);
      const l = el("span", "lbl"); l.textContent = n.label;
      const gc = el("span", "n");
      gc.textContent = pool.filter(p => f.values(p).some(v => codes.includes(v))).length;
      r.append(tw, cb, l, gc);
      r.onclick = () => {
        S.open = S.open.includes(openKey) ? S.open.filter(x => x !== openKey) : [...S.open, openKey];
        update();
      };
      g.append(r);
      if (isOpen) {
        const kd = el("div", "kids");
        kids.forEach(k => kd.append(leaf(k)));
        g.append(kd);
      }
      box.append(g);
    }
    root.append(box);
  }
  // year range
  const yb = el("div", "facet");
  yb.innerHTML = `<div class="facet-head"><span>Years</span></div>
    <div class="years"><input type="number" id="y0" min="${YMIN}" max="${YMAX}" value="${S.y0}"> – <input type="number" id="y1" min="${YMIN}" max="${YMAX}" value="${S.y1}"></div>`;
  root.append(yb);
  yb.querySelector("#y0").onchange = e => { S.y0 = +e.target.value || YMIN; update(); };
  yb.querySelector("#y1").onchange = e => { S.y1 = +e.target.value || YMAX; update(); };
}

function toggle(fid, codes, on) {
  const s = new Set(S.sel[fid]);
  codes.forEach(c => on ? s.add(c) : s.delete(c));
  S.sel[fid] = [...s];
  update();
}

// ---- main list ----
const sorters = {
  "year-desc": (a, b) => b.year - a.year || a.title.localeCompare(b.title),
  "year-asc": (a, b) => a.year - b.year || a.title.localeCompare(b.title),
  "title": (a, b) => a.title.localeCompare(b.title),
  "author": (a, b) => a.authors.localeCompare(b.authors) || a.year - b.year,
};

function groupBy(list, dims) {
  if (!dims.length) return null;
  const g = GROUPS[dims[0]], buckets = new Map();
  for (const p of list) for (const k of g.keys(p)) {
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(p);
  }
  let keys = [...buckets.keys()];
  if (g.order) keys.sort((a, b) => idx(g.order, a) - idx(g.order, b));
  else keys.sort((a, b) => S.sort === "year-asc" ? a.localeCompare(b) : b.localeCompare(a));
  return keys.map(k => ({ key: k, items: buckets.get(k), sub: groupBy(buckets.get(k), dims.slice(1)) }));
}
const idx = (arr, v) => { const i = arr.indexOf(v); return i < 0 ? 1e9 : i; };

function chip(cls, text) { const c = el("span", "chip " + cls); c.textContent = text; return c; }

// representative of a bin: journal paper > preprint/TDR > public note > proceedings, then newest
const DOC_RANK = { "Journal article": 0, "Journal (review)": 0, "Preprint": 1, "Technical design report": 1,
                   "Public note (CONF / PUB / PAS / DP)": 2, "Proceedings / talk": 3 };
const repOrder = (a, b) => (DOC_RANK[a.doctype] ?? 9) - (DOC_RANK[b.doctype] ?? 9) || b.year - a.year;

function titleLink(p) {
  if (!p.url) { const s = el("span", "tt"); s.textContent = p.title; return s; }

  return a;
}

function binChip(b) {

  c.title = (b.note ? b.note + "\n\n" : "") + "Click: show only this bin" + (EDITABLE ? " · Shift-click: edit note" : "");
  c.onclick = e => { if (e.shiftKey && EDITABLE) editBinNote(b); else { S.sel.bin = [b.name]; update(); } };
  return c;
}

function paperEl(p, others) {

    (p.report && !p.venue.includes(p.report.split(",")[0]) ? " · " + p.report.split(",")[0] : "")));

  ch.append(rt, k, rb);

    for (const o of others) {
      const row = el("div", "o" + (READ.has(o.key) ? " isread" : "") + (passes(o) ? "" : " out"));
      if (!passes(o)) row.title = "Does not match the current filters";
      if (EDITABLE) {
        const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = SEL.has(o.key);
        cb.onchange = () => { cb.checked ? SEL.add(o.key) : SEL.delete(o.key); renderSelbar(); };
        row.append(cb);

      if (!EDITABLE && !READ.has(o.key)) ort.style.display = "none";
      row.append(yr, ty, titleLink(o), info, ort, ok);
      box.append(row);
    }
    body.append(box);

  d.append(pick, body);
  return d;
}

function renderGroups(container, groups, level, path) {
  for (const g of groups) {
    const id = path + "/" + g.key;
    const det = el("details", "group l" + level);
    det.open = !closed.has(id);
    det.ontoggle = () => { det.open ? closed.delete(id) : closed.add(id); };
    const sm = document.createElement("summary");
    sm.textContent = g.key + " ";
    const n = el("span", "gn"); n.textContent = g.items.length;
    sm.append(n);
    const body = el("div", "body");
    if (g.sub) renderGroups(body, g.sub, level + 1, id);
    else g.items.forEach(p => body.append(paperEl(p, S.merge ? othersOf[p.key] : null)));
    det.append(sm, body);
    container.append(det);
  }
}
const closed = new Set();

let current = [];      // papers matching the filters
let shown = [];        // what is listed (bin representatives when merging)
let othersOf = {};     // representative key -> other bin members
function render() {
  current = P.filter(p => passes(p)).sort(sorters[S.sort]);
  othersOf = {};
  if (S.merge) {
    const seen = new Set();
    shown = [];
    for (const p of current) {
      const b = binOf[p.key];
      if (!b) { shown.push(p); continue; }
      if (seen.has(b)) continue;
      seen.add(b);
      const rep = current.filter(q => binOf[q.key] === b).sort(repOrder)[0];
      othersOf[rep.key] = b.keys.filter(k => k !== rep.key).map(k => BYKEY[k]).sort(repOrder);
      shown.push(rep);
    }
    shown.sort(sorters[S.sort]);
  } else shown = current;
  const list = document.getElementById("list");
  list.innerHTML = "";
  const nRead = current.filter(p => READ.has(p.key)).length;
  document.getElementById("count").textContent = `${current.length} of ${P.length} papers` +
    (S.merge && shown.length !== current.length ? ` · ${shown.length} after merging bins` : "") +
    ` · ${nRead} read`;
  renderActive();
  renderSelbar();
  showView();
  if (S.view === "graph") { renderGraph(); return; }
  if (!current.length) { list.innerHTML = `<div class="empty">No papers match these filters.</div>`; return; }
  const dims = [S.g1, S.g2, S.g3].filter(d => d !== "none");
  const groups = groupBy(shown, dims);
  if (groups) renderGroups(list, groups, 1, "");
  else shown.forEach(p => list.append(paperEl(p, S.merge ? othersOf[p.key] : null)));
}

function renderActive() {
  const a = document.getElementById("active");
  a.innerHTML = "";
  const lab = { exp: expLabel, coll: collLabel, topic: topicLabel, doctype: x => x,
                status: x => x === "read" ? "Read" : "Unread", bin: x => x === NOBIN ? "Not in a bin" : "⧉ " + x };
  const cls = { exp: "exp", coll: "coll", topic: "topic", doctype: "type", status: "type", bin: "bin" };
  for (const f of FACETS) for (const v of S.sel[f.id]) {
    const c = chip(cls[f.id], lab[f.id](v)); c.title = "Remove filter";
    c.onclick = () => toggle(f.id, [v], false);
    a.append(c);
  }
}

function update() {
  S.sel.bin = S.sel.bin.filter(n => n === NOBIN || BINS.some(b => b.name === n));
  saveState(); renderFacets(); render();
}

// symbols: equal-area shapes keyed by document type
function shape(kind, area) {
  const r = Math.sqrt(area / Math.PI);
  switch (kind) {
    case 1: { const a = Math.sqrt(area) / 2; return `M${-a},${-a}h${2*a}v${2*a}h${-2*a}z`; }
    case 2: { const a = Math.sqrt(area / 2); return `M0,${-a}L${a},0L0,${a}L${-a},0z`; }
    case 3: { const a = Math.sqrt(area * 4 / Math.sqrt(3)) / 2, h = a * Math.sqrt(3); return `M0,${-h*2/3}L${a},${h/3}L${-a},${h/3}z`; }
    case 4: { const a = Math.sqrt(area * 4 / Math.sqrt(3)) / 2, h = a * Math.sqrt(3); return `M0,${h*2/3}L${a},${-h/3}L${-a},${-h/3}z`; }
    case 5: { let d = ""; const R = r * 1.45, ri = R * .45; for (let i = 0; i < 10; i++) { const ang = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? ri : R; d += (i ? "L" : "M") + (rr*Math.cos(ang)).toFixed(2) + "," + (rr*Math.sin(ang)).toFixed(2); } return d + "z"; }
    case 6: { const a = r * .5, b = r * 1.25; return `M${-a},${-b}h${2*a}v${b-a}h${b-a}v${2*a}h${a-b}v${b-a}h${-2*a}v${a-b}h${a-b}v${-2*a}h${b-a}z`; }
    default: return `M${r},0A${r},${r} 0 1,1 ${-r},0A${r},${r} 0 1,1 ${r},0z`;
  }
}
const SHAPE_OF = { "Journal article": 0, "Journal (review)": 1, "Preprint": 2, "Technical design report": 5,
                   "Public note (CONF / PUB / PAS / DP)": 3, "Proceedings / talk": 6 };
const shapeOf = p => SHAPE_OF[p.doctype] ?? 4;
const primary = {
  facility: p => p.exp.length ? facOf(p.exp[0]) : "Unclassified",
  area: p => p.topics.length ? topicGroup(p.topics[0]) : "Unclassified",
  coll: p => p.coll ? collLabel(p.coll) : "Unclassified",
  doctype: p => p.doctype,
};
const orderOf = {
  facility: [...M.facilityOrder, "Unclassified"],
  area: [...M.topicGroupOrder, "Unclassified"],
  coll: [...Object.values(M.collisions), "Unclassified"],
  doctype: DOCTYPES,
};
const GLINKS = [], OUT = {}, IN = {};
if (CITES) {
  for (const [a, b, how, ins] of CITES.edges) {
    if (!BYKEY[a] || !BYKEY[b]) continue;
    const e = { s: a, t: b, how, ins };
    GLINKS.push(e);
    (OUT[a] = OUT[a] || []).push(e); (IN[b] = IN[b] || []).push(e);
  }
}
const indeg = k => (IN[k] || []).length;
const srcLabel = e => e.how && e.ins ? "PDF + INSPIRE" : e.how ? "PDF: " + e.how : "INSPIRE";
let gSel = null, gPos = {};

function colorScale(dim) {
  const vals = orderOf[dim].filter(v => v !== "Unclassified");
  const m = {}; vals.forEach((v, i) => m[v] = i < 8 ? `var(--s${i + 1})` : "var(--muted)");
  m["Unclassified"] = "var(--muted)";
  return v => m[v] || "var(--muted)";
}

function renderGraph() {
  const svg = document.getElementById("gsvg");
  svg.innerHTML = "";
  const tip = document.getElementById("gtip");
  if (!CITES) {
    document.getElementById("gcount").textContent = "No citation data";
    document.getElementById("glegend").innerHTML = "Run <code>python3 citegraph.py</code> in the project folder to create citations.json, then reload.";
    return;
  }
  document.getElementById("glane").value = S.glane;
  document.getElementById("gcolor").value = S.gcolor;
  document.getElementById("glabels").checked = S.glabels;
  const nodes = current.filter(p => p.year);
  const vis = new Set(nodes.map(p => p.key));
  const links = GLINKS.filter(e => vis.has(e.s) && vis.has(e.t));
  if (gSel && !vis.has(gSel)) gSel = null;
  document.getElementById("gcount").textContent = `${nodes.length} papers · ${links.length} citation links`;
  const col = colorScale(S.gcolor);

  // legend
  const lg = document.getElementById("glegend"); lg.innerHTML = "";
  const colVals = orderOf[S.gcolor].filter(v => nodes.some(p => primary[S.gcolor](p) === v));
  const leg = (label, items) => { const b = el("span"); b.innerHTML = `<b>${label}</b>`; lg.append(b); items.forEach(i => lg.append(i)); };
  const sw = (d, fill, text) => { const sp = el("span"); sp.innerHTML = `<svg width="14" height="14"><path transform="translate(7,7)" d="${d}" fill="${fill}"/></svg>`; sp.append(text); return sp; };
  leg("Colour:", colVals.map(v => sw(shape(0, 70), col(v), v)));
  const sep = el("span"); sep.style.width = "100%"; sep.style.height = "0"; lg.append(sep);
  const shapeVals = DOCTYPES.filter(v => nodes.some(p => p.doctype === v));
  leg("Shape:", shapeVals.map(v => sw(shape(SHAPE_OF[v] ?? 4, 70), "var(--muted)", v.replace(" (CONF / PUB / PAS / DP)", ""))));
  const sep2 = el("span"); sep2.style.width = "100%"; sep2.style.height = "0"; lg.append(sep2);
  const k1 = el("span"); k1.innerHTML = `<svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--cites)" stroke-width="2"/></svg>cites`;
  const k2 = el("span"); k2.innerHTML = `<svg width="30" height="8"><line x1="0" y1="4" x2="30" y2="4" stroke="var(--citedby)" stroke-width="2" stroke-dasharray="5 3"/></svg>cited by`;
  const k3 = el("span"); k3.innerHTML = `<svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="var(--muted)" stroke="var(--ink)" stroke-dasharray="2 1.5"/></svg>no reference list available`;
  const k4 = el("span"); k4.textContent = "Size = times cited within the collection";
  leg("Links:", [k1, k2, k3, k4]);

  // layout
  const W = Math.max(1000, document.getElementById("gstage").clientWidth - 2), ML = 180, MR = 30, MT = 30, MB = 28, ROW = S.glabels ? 17 : 13, PAD = 10;
  const yrsV = nodes.map(p => p.year);
  const y0 = Math.min(...yrsV), y1 = Math.max(...yrsV);
  const lo = y0, x = (() => {
    const dom = y0 < 1990 ? [y0 - 1, 1990, 2005, y1 + 1] : y0 < 2003 ? [y0 - 1, 2005, y1 + 1] : [y0 - 1, y1 + 1];
    const rng = y0 < 1990 ? [0, .12, .27, 1] : y0 < 2003 ? [0, .22, 1] : [0, 1];
    return y => { let i = 0; while (i < dom.length - 2 && y > dom[i + 1]) i++;
      const f = (y - dom[i]) / (dom[i + 1] - dom[i]); return ML + (W - ML - MR) * (rng[i] + f * (rng[i + 1] - rng[i])); };
  })();
  const size = p => 34 + indeg(p.key) * 14;
  const rad = p => Math.sqrt(size(p) / Math.PI) * 1.15 + 1;
  const lanesV = orderOf[S.glane].filter(v => nodes.some(p => primary[S.glane](p) === v));
  let yy = MT; const lanes = [];
  for (const lv of lanesV) {
    const arr = nodes.filter(p => primary[S.glane](p) === lv).sort((a, b) => a.year - b.year || indeg(b.key) - indeg(a.key));
    const ends = [];
    for (const p of arr) {
      const px = x(p.year) + ((p.key.length * 7) % 9 - 4);
      const w = S.glabels ? p.authors.split(" ")[0].length * 6 + 40 : 4;
      const left = px - rad(p) - 3, right = px + rad(p) + 4 + w;
      let r = ends.findIndex(e => e < left); if (r < 0) { r = ends.length; ends.push(0); }
      ends[r] = right; gPos[p.key] = { x: px, row: r };
    }
    const n = Math.max(ends.length, 1), h = Math.max(n * ROW + PAD * 2, 44);
    for (const p of arr) gPos[p.key].y = yy + h / 2 - (n - 1) * ROW / 2 + gPos[p.key].row * ROW;
    lanes.push({ lv, y: yy, h, n: arr.length });
    yy += h + 3;
  }
  const H = yy + MB;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  const defs = svgEl("defs", {}, svg);
  for (const [id, c] of [["ga", "var(--edge)"], ["go", "var(--cites)"], ["gi", "var(--citedby)"]]) {
    const m = svgEl("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 5, markerHeight: 5, orient: "auto" }, defs);
    svgEl("path", { d: "M0,1L9,5L0,9z", fill: c }, m);
  }
  for (const l of lanes) {
    svgEl("rect", { class: "glane", x: 0, y: l.y, width: W, height: l.h }, svg);
    const t = svgEl("text", { class: "glane-l", x: 12, y: l.y + l.h / 2 - 2 }, svg); t.textContent = l.lv.replace(" (CONF / PUB / PAS / DP)", "");
    const t2 = svgEl("text", { class: "glane-n", x: 12, y: l.y + l.h / 2 + 12 }, svg); t2.textContent = l.n + " papers";
  }
  const ticks = []; const step = y1 - y0 < 12 ? 1 : 5; for (let t = Math.ceil(lo / step) * step; t <= y1; t += step) if (t >= 2005 || t % 10 === 0) ticks.push(t);
  for (const t of ticks) {
    svgEl("line", { class: "ggrid", x1: x(t), x2: x(t), y1: MT, y2: H - MB }, svg);
    for (const ty of [MT - 10, H - MB + 17]) { const tx = svgEl("text", { class: "gaxis", x: x(t), y: ty, "text-anchor": "middle" }, svg); tx.textContent = t; }
  }
  const eG = svgEl("g", {}, svg), nG = svgEl("g", {}, svg);
  const ePaths = links.map(e => {
    const s = gPos[e.s], t = gPos[e.t], dx = t.x - s.x, dy = t.y - s.y, dist = Math.hypot(dx, dy) || 1, rt = rad(BYKEY[e.t]) + 1;
    const tx = t.x - dx / dist * rt, ty = t.y - dy / dist * rt, bend = Math.min(70, dist * .22);
    const mx = (s.x + tx) / 2 - dy / dist * bend, my = (s.y + ty) / 2 + dx / dist * bend;
    const path = svgEl("path", { class: "gedge", d: `M${s.x},${s.y}Q${mx},${my} ${tx},${ty}`, "marker-end": "url(#ga)" }, eG);
    path._e = e; return path;
  });
  const nEls = nodes.map(p => {
    const g = svgEl("g", { class: "gnode" + (CITES.coverage[p.key] === "none" || !CITES.coverage[p.key] ? " noref" : "") + (READ.has(p.key) ? " isread" : ""),
                           transform: `translate(${gPos[p.key].x},${gPos[p.key].y})`, tabindex: 0, role: "button",
                           "aria-label": `${p.authors} ${p.year}: ${p.title}` }, nG);
    svgEl("path", { d: shape(shapeOf(p), size(p)), fill: col(primary[S.gcolor](p)) }, g);
    if (S.glabels) { const t = svgEl("text", { x: rad(p) + 3, dy: "0.35em" }, g); t.textContent = shortLabel(p); }
    g._p = p;
    g.addEventListener("mouseenter", ev => { if (!gSel) focusG(p.key); showTip(ev, p); });
    g.addEventListener("mousemove", ev => showTip(ev, p));
    g.addEventListener("mouseleave", () => { tip.hidden = true; if (!gSel) focusG(null); });
    g.addEventListener("click", ev => { ev.stopPropagation(); selectG(gSel === p.key ? null : p.key); });
    g.addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectG(gSel === p.key ? null : p.key); } });
    return g;
  });
  svg.onclick = () => selectG(null);
  function showTip(ev, p) {
    const st = document.getElementById("gstage"), r = st.getBoundingClientRect();
    const no = (OUT[p.key] || []).filter(e => vis.has(e.t)).length, ni = (IN[p.key] || []).filter(e => vis.has(e.s)).length;
    const cov = { "pdf+inspire": "PDF + INSPIRE", pdf: "PDF only", inspire: "INSPIRE only", none: "none" }[CITES.coverage[p.key]] || "none";
    tip.innerHTML = `<div class="tt"></div><div class="mm"></div><div class="mm"></div>`;
    tip.children[0].textContent = p.title;
    tip.children[1].textContent = `${p.authors} · ${p.year} · ${p.doctype}`;
    tip.children[2].textContent = `Cites ${no} · cited by ${ni} in this view · references from: ${cov}`;
    tip.hidden = false;
    let lx = ev.clientX - r.left + st.scrollLeft + 14; const ly = ev.clientY - r.top + 14;
    if (lx + 370 > st.scrollLeft + st.clientWidth) lx -= 390;
    tip.style.left = lx + "px"; tip.style.top = ly + "px";
  }
  function focusG(k) {
    const nb = new Set(k ? [k, ...(OUT[k] || []).map(e => e.t), ...(IN[k] || []).map(e => e.s)] : []);
    nEls.forEach(g => { g.classList.toggle("dim", !!k && !nb.has(g._p.key)); g.classList.toggle("sel", g._p.key === k); });
    ePaths.forEach(pth => {
      const e = pth._e, cls = !k ? "gedge" : e.s === k ? "gedge out" : e.t === k ? "gedge in" : "gedge dim";
      pth.setAttribute("class", cls);
      pth.setAttribute("marker-end", cls === "gedge out" ? "url(#go)" : cls === "gedge in" ? "url(#gi)" : "url(#ga)");
      if (k && (e.s === k || e.t === k)) eG.append(pth);
    });
  }
  function selectG(k) { gSel = k; focusG(k); renderGDetail(vis); }
  renderGraph.select = selectG;
  focusG(gSel); renderGDetail(vis); renderMissing();
  document.getElementById("gnote").textContent =
    `Links come from two sources: the PDFs attached in the local Zotero library (searched for each paper's arXiv ID, DOI, report number, ` +
    `journal reference or full title) and INSPIRE-HEP reference lists. ${GLINKS.filter(e => e.how && e.ins).length} links are found by both, ` +
    `${GLINKS.filter(e => e.how && !e.ins).length} only in the PDFs (mostly CONF/PAS/DP notes INSPIRE does not link) and ` +
    `${GLINKS.filter(e => !e.how).length} only in INSPIRE (mostly papers without a PDF in Zotero). Generated ${CITES.generated}; ` +
    `rerun citegraph.py after adding papers. Lanes and colours use each paper's first experiment / topic. The sidebar filters apply here too.`;
}
function shortLabel(p) {
  const a = p.authors.replace(/ Collaborations?$/, "").replace(/ et al\.$/, "").split(/, | & /)[0];
  return `${a.length > 16 ? a.slice(0, 15) + "…" : a} ${p.year}`;
}
function renderGDetail(vis) {
  const d = document.getElementById("gdetail");
  d.innerHTML = "";
  if (!gSel) { const x = el("div"); x.innerHTML = `<h3>Selection</h3><p style="color:var(--muted);margin:0">Click a paper to list what it cites and what cites it. Hover to preview.</p>`; d.append(x); return; }
  const p = BYKEY[gSel];
  const a = el("div");
  a.innerHTML = `<h3></h3><h2></h2><div style="color:var(--muted);font-size:12.5px"></div>`;
  a.children[0].textContent = (p.exp.map(expLabel).join(", ") || "Unclassified") + " · " + p.doctype;
  a.children[1].append(titleLink(p));
  a.children[2].textContent = `${p.authors} · ${p.year}${p.venue ? " · " + p.venue : ""} · ${p.key}`;
  d.append(a);
  const list = (title, es, other) => {
    const box = el("div"); const h = el("h3"); h.textContent = `${title} (${es.length})`; box.append(h);
    if (!es.length) { const n = el("p"); n.style.cssText = "color:var(--muted);margin:0"; n.textContent = "None in the collection."; box.append(n); return box; }
    const ul = el("ul");
    es.map(e => [e, BYKEY[e[other]]]).sort((x, y) => x[1].year - y[1].year).forEach(([e, q]) => {
      const li = el("li"), yr = el("span", "yr"), b = el("button"), src = el("span", "src");
      yr.textContent = q.year; b.textContent = `${shortLabel(q)}: ${q.title}`; src.textContent = srcLabel(e);
      if (!vis.has(q.key)) b.style.opacity = .55;
      b.onclick = () => vis.has(q.key) ? renderGraph.select(q.key) : (gSel = q.key, renderGDetail(vis));
      li.append(yr, b, src); ul.append(li);
    });
    box.append(ul); return box;
  };
  d.append(list("Cites", OUT[gSel] || [], "t"), list("Cited by", IN[gSel] || [], "s"));
}
function renderMissing() {
  const box = document.getElementById("gmissing");
  if (box.dataset.done) return;
  box.dataset.done = 1;
  const ms = CITES.missing || [];
  box.innerHTML = `<summary>Cited most often by the collection but not in it (${ms.length})</summary>
    <table><thead><tr><th>Cited by</th><th>Year</th><th>Paper</th><th>INSPIRE key</th></tr></thead><tbody></tbody></table>`;
  const tb = box.querySelector("tbody");
  for (const m of ms) {
    const tr = el("tr");
    tr.innerHTML = `<td class="n"></td><td></td><td></td><td><code></code></td>`;
    tr.children[0].textContent = m.count; tr.children[1].textContent = m.year;
    const a = document.createElement("a"); a.href = "https://inspirehep.net/literature/" + m.recid; a.target = "_blank"; a.rel = "noopener";
    a.textContent = m.title; tr.children[2].append(a, document.createTextNode(m.who ? " · " + m.who : ""));
    tr.children[3].firstChild.textContent = m.texkey;
    tb.append(tr);
  }
}
for (const b of document.querySelectorAll(".tabs button")) b.onclick = () => { S.view = b.dataset.view; update(); };
document.getElementById("glane").onchange = e => { S.glane = e.target.value; update(); };
document.getElementById("gcolor").onchange = e => { S.gcolor = e.target.value; update(); };
document.getElementById("glabels").onchange = e => { S.glabels = e.target.checked; update(); };
let gResize; addEventListener("resize", () => { clearTimeout(gResize); gResize = setTimeout(() => { if (S.view === "graph") renderGraph(); }, 150); });
document.getElementById("menu2").onclick = () => document.getElementById("side").classList.toggle("open");

update();
</script>
